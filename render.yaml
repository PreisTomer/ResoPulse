services:
  - type: web
    name: resopulse-backend
    runtime: node
    rootDir: backend
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false   # set this in the Render dashboard to your Vercel URL
    healthCheckPath: /health
