name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # Delete the Windows-generated lockfile before installing so npm resolves
        # platform-specific optional binaries (e.g. @rollup/rollup-linux-x64-gnu)
        # for the current OS rather than skipping entries absent from the lockfile.
        run: rm -f package-lock.json && npm install

      - name: Run tests
        run: npm test

      - name: Build (type-check + bundle)
        run: npm run build:all
