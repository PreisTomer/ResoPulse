name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # npm install (not npm ci) because package-lock.json is generated on Windows and
        # does not contain the Linux-specific @rollup/rollup-linux-x64-gnu optional binary.
        # npm ci enforces the lockfile strictly and fails; npm install resolves optional
        # platform deps for the current OS.
        run: npm --prefix frontend install

      - name: Run tests
        run: npm --prefix frontend run test

      - name: Build (type-check + bundle)
        run: npm --prefix frontend run build
