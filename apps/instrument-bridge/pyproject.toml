[project]
name = "instrument-bridge"
version = "0.1.0"
description = "Hardware instrument bridge for SimBiotix — streams impedance readings to the Socket.IO backend."
requires-python = ">=3.11"
dependencies = [
    "python-socketio[asyncio_client]>=5.11",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "click>=8.1",
    "rich>=13.7",
    "loguru>=0.7",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
visa   = ["pyvisa>=1.14", "pyvisa-py>=0.7"]
all    = ["instrument-bridge[serial,visa]"]

[project.scripts]
instrument-bridge = "instrument_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/instrument_bridge"]

