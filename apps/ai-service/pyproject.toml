[project]
name = "resopulse-ai-service"
version = "0.1.0"
description = "ResoPulse AI protocol optimizer — FastAPI service backed by XGBoost."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "xgboost>=2.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "numpy>=1.26",
    "joblib>=1.4",
    "click>=8.1",
    "rich>=13.7",
]

[project.scripts]
resopulse-ai = "resopulse_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resopulse_ai"]

[dependency-groups]
dev = ["pytest>=8.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
